# ====================================
# Banco de Dados (Local / Docker)
# ====================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/artists_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:artists}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:artists}
spring.datasource.driver-class-name=org.postgresql.Driver

# ====================================
# JPA / Hibernate
# ====================================

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# ====================================
# Flyway
# ====================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ====================================
# MinIO (Local / Docker)
# ====================================

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket.name=${MINIO_BUCKET_NAME:artists-images}

# ====================================
# Aplicação
# ====================================

server.port=8080
logging.level.org.springframework=INFO
logging.level.br.gov.seplag=DEBUG

# ====================================
# JWT
# ====================================

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=300000

# ====================================
# Actuator (Health Checks)
# ====================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoint.health.probes.enabled=true